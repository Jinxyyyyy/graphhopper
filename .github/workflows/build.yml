name: Build, Test & PIT
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [24, 25-ea]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bc libxml2-utils

      - name: Make scripts executable
        run: chmod +x .github/workflows/scripts/*.sh

      # Téléchargement des scores PIT du run précédent
      - name: Download previous PIT scores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/workflows/scripts/download-pit-scores.sh \
          "${{ github.workflow }}" \
          "${{ github.ref_name }}" \

      - name: Build all modules
        run: mvn -B clean install -Djacoco.skip=false

      - name: Run PIT mutation testing
        id: pit-test
        env:
          EXCLUDED_MODULES: "core|reader-gtfs"
        run: |
          echo "ALL MODULE ARE BEING TEST, EXCLUDING CORE AND READER_GTFS"
          .github/workflows/scripts/run-pit-test.sh 

        # "${{ steps.modules.outputs.modules }}"

      # Vérification des scores de mutation par module
      - name: Check mutation coverage regression
        id: mutation-check
        run: .github/workflows/scripts/check-mutation-regression.sh

      - name: Rickroll Test Failure
        if: failure() && steps.pit-test.outcome == 'failure'
        uses: ./.github/workflows/actions/Rickroll
        with:
          mode: "mutation"
      - name: Rickroll Test Failure
        if: failure() && steps.pit-test.outcome == 'failure'
        uses: ./.github/workflows/actions/Rickroll
        with:
          mode: "test"

      - name: Rickroll Summary
        if: failure()
        run: |
          {
            echo "# YOU GOT RICKROLLED!"
            echo ""
            echo "![Rickroll](https://media.giphy.com/media/Vuw9m5wXviFIQ/giphy.gif)"
            echo ""

            if [ "${{ steps.mutation-check.outcome }}" = "failure" ]; then
              echo "## Mutation Coverage Regression Detected!"
              echo "Never gonna let those mutants survive!"
            elif [ "${{ steps.pit-test.outcome }}" = "failure" ]; then
              echo "## Test Failure Detected!"
              echo "Never gonna let your tests run around and desert you!"
            fi
          } >> $GITHUB_STEP_SUMMARY

      # Upload des scores comme artifact (baseline pour le prochain run)
      - name: Upload PIT scores baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-scores-baseline
          path: pit-score-*.txt
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

      # Artifacts pour consultation
      - name: Upload PIT reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports-java-${{ matrix.java-version }}
          path: '**/target/pit-reports'
          if-no-files-found: ignore
          retention-days: 30

      - name: Archive test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java-${{ matrix.java-version }}
          path: '**/target/surefire-reports'
          retention-days: 7
